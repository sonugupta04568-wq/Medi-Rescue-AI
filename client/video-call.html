<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2-Way Video Call — MediRescue AI</title>
  <meta name="theme-color" content="#14213d" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary:#e63946; --navy:#1d3557; --navy-dark:#14213d; --teal:#2a9d8f; --muted:#93a8c4; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(160deg, var(--navy-dark) 0%, #0b1526 75%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1.4rem;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-wrap: wrap;
    }
    .brand { display:flex; align-items:center; gap:.5rem; font-weight:800; text-decoration:none; color:#fff; }
    .brand .logo { width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#b02a35);display:grid;place-items:center; }
    .room-chip {
      display:inline-flex;align-items:center;gap:.5rem;
      background:rgba(42,157,143,.18);border:1px solid rgba(42,157,143,.5);
      padding:.4rem .9rem;border-radius:999px;font-weight:700;font-size:.9rem;
    }
    .invite-row { display:flex;gap:.5rem;align-items:center;flex-wrap:wrap }
    .invite-input {
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
      color:#dbe4f0;padding:.45rem .8rem;border-radius:8px;font-size:.85rem;width:min(320px,70vw);
    }
    .btn-copy { background:var(--teal);color:#fff;border:none;padding:.5rem .9rem;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit }
    .btn-home { color:#dbe4f0;text-decoration:none;font-size:.9rem;font-weight:600 }
    .stage { flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:14px; min-height:0 }
    .panel {
      position:relative; background:#0b1526; border-radius:16px; overflow:hidden;
      border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; min-height:220px;
    }
    .panel video { width:100%; height:100%; object-fit:cover; background:#0b1526 }
    .panel.remote video { transform:none }
    .panel.local video { transform:scaleX(-1) }
    .tag {
      position:absolute;top:10px;left:10px;background:rgba(20,33,61,.75);backdrop-filter:blur(4px);
      padding:.3rem .75rem;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.5px
    }
    .live-dot { position:absolute;top:10px;right:10px;background:rgba(220,38,38,.92);padding:.3rem .7rem;border-radius:999px;font-size:.7rem;font-weight:800;letter-spacing:1px;animation:blink 1.4s infinite;display:none }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .wait {
      position:absolute;inset:0;display:flex;flex-direction:column;gap:.6rem;align-items:center;justify-content:center;
      color:var(--muted);text-align:center;padding:1.2rem;background:rgba(11,21,38,.85)
    }
    .wait .big { font-size:2.6rem }
    .wait p { font-size:.88rem; max-width:300px }
    .controlsbar {
      display:flex;justify-content:center;gap:1rem;padding:1rem;
      border-top:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)
    }
    .ctrl {
      width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
      background:rgba(255,255,255,.12);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit
    }
    .ctrl span{font-size:1.25rem;line-height:1}
    .ctrl small{font-size:.6rem;margin-top:3px;opacity:.85}
    .ctrl.active{background:var(--teal)}
    .ctrl.end{width:76px;height:76px;background:var(--primary);box-shadow:0 10px 26px rgba(230,57,70,.5)}
    .timer { font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;align-self:center }
    .statusline { text-align:center;color:#ff8f96;font-weight:700;padding-top:.6rem;font-size:.95rem }
    .banner-note {
      margin:0 14px 8px;background:rgba(244,162,97,.12);border:1px solid rgba(244,162,97,.45);color:#ffd9ad;
      padding:.55rem .9rem;border-radius:10px;font-size:.82rem;display:none
    }
    @media (max-width:760px){ .stage{grid-template-columns:1fr;grid-template-rows:1.4fr 1fr} }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="logo">🚑</span>MediRescue&nbsp;<span style="color:#ff6b74">AI</span></a>
    <span class="room-chip">👥 Room: <b id="room-code">…</b></span>
    <div class="invite-row">
      <input class="invite-input" id="invite-link" readonly />
      <button class="btn-copy" id="copy-btn" type="button">📋 Copy Link</button>
      <a class="btn-home" href="emergency.html">← SOS</a>
    </div>
  </div>

  <p class="statusline" id="status">Initializing camera…</p>
  <div class="banner-note" id="note"></div>

  <main class="stage">
    <section class="panel remote">
      <video id="remote-video" autoplay playsinline></video>
      <span class="tag">🧑‍⚕️ OTHER SIDE</span>
      <span class="live-dot" id="live-dot">● LIVE</span>
      <div class="wait" id="waiting">
        <span class="big">👥</span>
        <p><b>Waiting for the other person…</b></p>
        <p>Invite link copy karke bhejo (WhatsApp / SMS). Dono side camera allow karna hoga.</p>
      </div>
    </section>
    <section class="panel local">
      <video id="local-video" autoplay playsinline muted></video>
      <span class="tag">YOU</span>
    </section>
  </main>

  <div class="controlsbar">
    <button class="ctrl" id="mic-btn" type="button"><span>🎙️</span><small>Mic</small></button>
    <button class="ctrl" id="cam-btn" type="button"><span>🎥</span><small>Camera</small></button>
    <div class="timer" id="timer">00:00</div>
    <button class="ctrl end" id="end-btn" type="button"><span>📵</span><small>End</small></button>
  </div>

  <script src="js/app.js?v=13"></script>
  <script src="js/video-call.js?v=13"></script>
</body>
</html>
