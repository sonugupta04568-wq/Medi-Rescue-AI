<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blood Bank Finder — MediRescue AI</title>
  <meta name="description" content="Check blood group availability across nearby blood banks and raise emergency donor requests instantly." />
  <meta name="theme-color" content="#14213d" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=2" />
  <script>
    (function () {
      var t = localStorage.getItem("mr_theme");
      if (!t && window.matchMedia) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t || "light");
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav id="navbar"></nav>

  <main class="container" id="main">
    <div class="page-head">
      <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7 6.4 9.4a7 7 0 1 0 11.2 0L12 2.7Z"/></svg>Blood Bank Finder</h1>
      <p>Select a blood group to check availability across nearby blood banks (demo data).</p>
    </div>

    <section class="card">
      <h3 style="font-size:1.05rem;margin-bottom:.8rem">Select Blood Group</h3>
      <div class="chips" id="blood-chips">
        <button class="chip" data-g="A+">A+</button>
        <button class="chip" data-g="A-">A−</button>
        <button class="chip" data-g="B+">B+</button>
        <button class="chip" data-g="B-">B−</button>
        <button class="chip selected" data-g="O+">O+</button>
        <button class="chip" data-g="O-">O−</button>
        <button class="chip" data-g="AB+">AB+</button>
        <button class="chip" data-g="AB-">AB−</button>
      </div>
    </section>

    <h2 class="section-title" style="margin-top:2rem;font-size:1.3rem">Availability — <span id="selected-group">O+</span></h2>
    <div id="blood-list" class="grid grid-2"></div>

    <section class="card" style="margin-top:1.8rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center">
      <div>
        <h3 style="font-size:1.05rem">🆘 Need blood urgently?</h3>
        <p style="font-size:.88rem;color:var(--muted)">Raise an emergency donor request — nearby registered donors get alerted.</p>
      </div>
      <button id="donor-alert-btn" class="btn btn-primary btn-lg">📣 Emergency Donor Request</button>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="js/app.js"></script>
  <script src="js/blood.js"></script>
</body>
</html>
